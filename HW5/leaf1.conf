! leaf1.conf - EVPN Configuration
hostname leaf1

!
service routing protocols model multi-agent
!
vlan 10
   name server1_vlan
!
interface Vlan10
   description Gateway-for-server1
   ip address virtual 10.1.10.1/24
!
interface Ethernet3
   description Link-to-server1
   switchport mode access
   switchport access vlan 10
!
interface Loopback0
   ip address 192.168.0.101/32
!
interface Loopback1
   description VTEP
   ip address 192.168.1.101/32
!
interface Ethernet1
   description Link-to-spine1
   no switchport
   ip address 10.0.0.1/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2
   description Link-to-spine2
   no switchport
   ip address 10.0.0.7/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
ip virtual-router mac-address 00:00:00:00:00:01
!
ip routing
!
router bgp 65011
   router-id 192.168.0.101
   neighbor SPINE_UNDERLAY peer group
   neighbor SPINE_UNDERLAY remote-as 65001
   neighbor SPINE_UNDERLAY bfd
   neighbor SPINE_OVERLAY peer group
   neighbor SPINE_OVERLAY remote-as 65001
   neighbor SPINE_OVERLAY update-source Loopback0
   neighbor SPINE_OVERLAY ebgp-multihop 2
   neighbor SPINE_OVERLAY send-community extended
   neighbor 10.0.0.0 peer group SPINE_UNDERLAY
   neighbor 10.0.0.0 description Link-to-spine1
   neighbor 10.0.0.6 peer group SPINE_UNDERLAY
   neighbor 10.0.0.6 description Link-to-spine2
   neighbor 192.168.0.1 peer group SPINE_OVERLAY
   neighbor 192.168.0.1 description spine1-overlay
   neighbor 192.168.0.2 peer group SPINE_OVERLAY
   neighbor 192.168.0.2 description spine2-overlay
   !
   vlan 10
      rd 192.168.0.101:10010
      route-target both 1:10010
      redistribute learned
   !
   address-family ipv4
      network 192.168.0.101/32
      network 192.168.1.101/32
      neighbor SPINE_UNDERLAY activate
   !
   address-family evpn
      neighbor SPINE_OVERLAY activate
!
