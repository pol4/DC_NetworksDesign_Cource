! spine2.conf - EVPN Route Reflector
hostname spine2

!
service routing protocols model multi-agent
!
interface Loopback0
   ip address 192.168.0.2/32
!
interface Ethernet1
   description Link-to-leaf1
   no switchport
   ip address 10.0.0.6/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2
   description Link-to-leaf2
   no switchport
   ip address 10.0.0.8/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet3
   description Link-to-leaf3
   no switchport
   ip address 10.0.0.10/31
   bfd interval 300 min-rx 300 multiplier 3
!
ip routing
!
router bgp 65001
   router-id 192.168.0.2
   neighbor LEAF_UNDERLAY peer group
   neighbor LEAF_UNDERLAY bfd
   neighbor LEAF_OVERLAY peer group
   neighbor LEAF_OVERLAY update-source Loopback0
   neighbor LEAF_OVERLAY ebgp-multihop 2
   neighbor LEAF_OVERLAY send-community extended
   neighbor 10.0.0.7 peer group LEAF_UNDERLAY
   neighbor 10.0.0.7 remote-as 65011
   neighbor 10.0.0.7 description Link-to-leaf1
   neighbor 10.0.0.9 peer group LEAF_UNDERLAY
   neighbor 10.0.0.9 remote-as 65012
   neighbor 10.0.0.9 description Link-to-leaf2
   neighbor 10.0.0.11 peer group LEAF_UNDERLAY
   neighbor 10.0.0.11 remote-as 65013
   neighbor 10.0.0.11 description Link-to-leaf3
   neighbor 192.168.0.101 peer group LEAF_OVERLAY
   neighbor 192.168.0.101 remote-as 65011
   neighbor 192.168.0.101 description leaf1-overlay
   neighbor 192.168.0.102 peer group LEAF_OVERLAY
   neighbor 192.168.0.102 remote-as 65012
   neighbor 192.168.0.102 description leaf2-overlay
   neighbor 192.168.0.103 peer group LEAF_OVERLAY
   neighbor 192.168.0.103 remote-as 65013
   neighbor 192.168.0.103 description leaf3-overlay
   !
   address-family ipv4
      network 192.168.0.2/32
      neighbor LEAF_UNDERLAY activate
   !
   address-family evpn
      neighbor LEAF_OVERLAY activate
!
