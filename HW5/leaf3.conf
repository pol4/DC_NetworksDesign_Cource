! leaf3.conf - EVPN Configuration
hostname leaf3

!
service routing protocols model multi-agent
!
vlan 10
   name server3_vlan
!
vlan 20
   name server4_vlan
!
interface Vlan10
   description Gateway-for-server3
   ip address virtual 10.1.10.1/24
!
interface Vlan20
   description Gateway-for-server4
   ip address virtual 10.1.20.1/24
!
interface Ethernet3
   description Link-to-server3
   switchport mode access
   switchport access vlan 10
!
interface Ethernet4
   description Link-to-server4
   switchport mode access
   switchport access vlan 20
!
interface Loopback0
   ip address 192.168.0.103/32
!
interface Loopback1
   description VTEP
   ip address 192.168.1.103/32
!
interface Ethernet1
   description Link-to-spine1
   no switchport
   ip address 10.0.0.5/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2
   description Link-to-spine2
   no switchport
   ip address 10.0.0.11/31
   bfd interval 300 min-rx 300 multiplier 3
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
!
ip virtual-router mac-address 00:00:00:00:00:01
!
ip routing
!
router bgp 65013
   router-id 192.168.0.103
   neighbor SPINE_UNDERLAY peer group
   neighbor SPINE_UNDERLAY remote-as 65001
   neighbor SPINE_UNDERLAY bfd
   neighbor SPINE_OVERLAY peer group
   neighbor SPINE_OVERLAY remote-as 65001
   neighbor SPINE_OVERLAY update-source Loopback0
   neighbor SPINE_OVERLAY ebgp-multihop 2
   neighbor SPINE_OVERLAY send-community extended
   neighbor 10.0.0.4 peer group SPINE_UNDERLAY
   neighbor 10.0.0.4 description Link-to-spine1
   neighbor 10.0.0.10 peer group SPINE_UNDERLAY
   neighbor 10.0.0.10 description Link-to-spine2
   neighbor 192.168.0.1 peer group SPINE_OVERLAY
   neighbor 192.168.0.1 description spine1-overlay
   neighbor 192.168.0.2 peer group SPINE_OVERLAY
   neighbor 192.168.0.2 description spine2-overlay
   !
   vlan 10
      rd 192.168.0.103:10010
      route-target both 1:10010
      redistribute learned
   !
   vlan 20
      rd 192.168.0.103:10020
      route-target both 1:10020
      redistribute learned
   !
   address-family ipv4
      network 192.168.0.103/32
      network 192.168.1.103/32
      neighbor SPINE_UNDERLAY activate
   !
   address-family evpn
      neighbor SPINE_OVERLAY activate
!
